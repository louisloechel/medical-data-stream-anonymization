# ECG rhythm domain generalization hierarchy, used by the NonNumericalGeneralizer (generalizer: hierarchy).
# Leaves are the standard rhythm labels of Philips patient monitors (German UI), as delivered in the field
# `rhythm`. They are product labels, not patient data.
# Levels: rhythm group -> rhythm class -> monitor label. Use root "Rhythm" in the profile.
# Labels that are not part of the hierarchy are attached directly below the root.
