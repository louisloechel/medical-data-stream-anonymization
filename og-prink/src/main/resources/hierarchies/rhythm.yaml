  - ["Supraventricular", "Sinus", "Sinus-Bradykardie"]
  - ["Supraventricular", "Atrial fibrillation or irregular", "Afib Rhythmus"]
  - ["Supraventricular", "Atrial fibrillation or irregular", "HF unregelmäßig"]
  - ["Supraventricular", "Other SV", "SV-Rhythmus"]
  - ["Supraventricular", "Other SV", "SV-Tachykardie"]
  - ["Supraventricular", "Other SV", "SV-Bradykardie"]
  - ["Ventricular", "Ventricular ectopy pattern", "Bigeminus"]
  - ["Ventricular", "Ventricular ectopy pattern", "Trigeminus"]
  - ["Ventricular", "Ventricular ectopy pattern", "Vent-Rhythmus"]
  - ["Life-threatening", "VF or VT", "Vent Fib/Tachy"]
  - ["Life-threatening", "VF or VT", "Vent-Tachykardie"]
  - ["Life-threatening", "VF or VT", "Persistierende VT"]
  - ["Life-threatening", "Arrest", "Asystolie"]
