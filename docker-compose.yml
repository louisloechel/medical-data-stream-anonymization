# Single-machine stack (arm64 and amd64).
#
# Resource limits default to values that fit Docker Desktop with ~8 GB of
# memory. On a bigger server, override them via environment variables or an
# `.env` file next to this file (see .env.example and README "Resource settings").

# Rotate container logs (the Flink jobs log every record at INFO level).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-flink-config: &flink-config
  # Flink 1.19 reads conf/config.yaml; copy the repo's flink-conf.yaml there
  # (read-only mount, so the image entrypoint never rewrites the tracked file).
  entrypoint: ["/bin/bash", "-c", "cp /opt/flink/conf-repo/flink-conf.yaml /opt/flink/conf/config.yaml && exec /docker-entrypoint.sh \"$$@\"", "--"]
  volumes:
    - ./flink-conf.yaml:/opt/flink/conf-repo/flink-conf.yaml:ro

services:
  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper), multi-arch image.
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"   # host access: localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INSIDE://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Disk safety: a partition is trimmed when it exceeds the age OR the size
      # limit (whichever comes first); old data is deleted in whole segments.
      # Worst-case disk use ~ topics x partitions x (RETENTION_BYTES + SEGMENT_BYTES),
      # see README "Scaling to an ICU workload".
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-6}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-3221225472}  # per partition, 3 GiB
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-268435456}      # 256 MiB
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      start_period: 20s
      retries: 12
    deploy:
      resources:
        limits:
          memory: ${KAFKA_MEM_LIMIT:-1g}
    restart: unless-stopped
    networks:
      - kafka-network
    logging: *default-logging

  kafka-init:
    # Creates the topics used by the pipeline, then exits.
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in raw-topic processed-topic prink-topic; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    restart: "no"
    networks:
      - kafka-network
    logging: *default-logging

  load-generator:
    build:
      context: ./load-generator
    environment:
      INPUT_DIR: ${INPUT_DIR:-output_json_files}
      RATE_HZ: ${RATE_HZ:-1}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:29092}
      REPLAY_MODE: ${REPLAY_MODE:-fixed-rate}
      SPEEDUP: ${SPEEDUP:-1}
      LOOP: ${LOOP:-1}
      RESCAN_SECONDS: ${RESCAN_SECONDS:-0}
      STATS_SECONDS: ${STATS_SECONDS:-10}
    # Real data is never part of the image (see load-generator/.dockerignore).
    # To replay data from the host, mount it read-only, e.g. in a (git-ignored)
    # docker-compose.override.yml, and set INPUT_DIR (sub-folders are scanned,
    # *.json, *.jsonl and *.jsonl.gz; see README "Scaling to an ICU workload"):
    # volumes:
    #   - ./load-generator/output_dwc:/app/output_dwc:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # JSON Lines files are streamed; legacy *.json arrays are loaded
          # one file per patient
          memory: ${LOAD_GENERATOR_MEM_LIMIT:-512m}
    restart: unless-stopped
    networks:
      - kafka-network
    logging: *default-logging

  kafka-consumer:
    build:
      context: ./consumer-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"  # Prometheus metrics
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    deploy:
      resources:
        limits:
          memory: ${CONSUMER_MEM_LIMIT:-768m}
    restart: unless-stopped
    networks:
      - kafka-network
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    networks:
      - kafka-network
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.0.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/news2-dashboard.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      # Datasource + dashboards are provisioned from the repo (read-only);
      # Grafana's own state lives in a named volume, so the repo stays clean.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    networks:
      - kafka-network
    logging: *default-logging

  flink-jobmanager:
    image: flink:1.19
    <<: *flink-config
    command: ["jobmanager"]
    ports:
      - "8081:8081"   # Flink web UI / REST
      - "9250:9249"   # Prometheus metrics (JobManager)
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: |
        jobmanager.memory.process.size: ${FLINK_JM_PROCESS_SIZE:-1024m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 24
    deploy:
      resources:
        limits:
          cpus: "${FLINK_JM_CPUS:-2}"
          memory: ${FLINK_JM_MEM_LIMIT:-1280m}
    restart: unless-stopped
    networks:
      - kafka-network
    logging: *default-logging

  flink-taskmanager:
    image: flink:1.19
    <<: *flink-config
    command: ["taskmanager"]
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    ports:
      - "9251:9249"   # Prometheus metrics (TaskManager)
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: |
        taskmanager.memory.process.size: ${FLINK_TM_PROCESS_SIZE:-2048m}
    deploy:
      resources:
        limits:
          cpus: "${FLINK_TM_CPUS:-4}"
          memory: ${FLINK_TM_MEM_LIMIT:-2304m}
    restart: unless-stopped
    networks:
      - kafka-network
    logging: *default-logging

  # Job-submitting clients (scripts/flink-submit.sh): wait for a free slot, submit
  # the job detached unless it is already running, then keep watching and
  # re-submit it if it disappears (JobManager restart, host reboot).
  flink-job:
    build:
      context: ./flink-job
    entrypoint: ["/opt/scripts/flink-submit.sh"]
    environment:
      JAR: /flink-job/flink-job.jar
      JOB_NAME_REGEX: "^Kafka Flink Job$$"
    volumes:
      - ./scripts/flink-submit.sh:/opt/scripts/flink-submit.sh:ro
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    networks:
      - kafka-network
    logging: *default-logging

  og-prink-job:
    build:
      context: ./og-prink
    entrypoint: ["/opt/scripts/flink-submit.sh"]
    environment:
      JAR: /opt/flink/usrlib/artifacts/1/prink-0.6.jar
      # Default job name is "<profile>_k<k>_delta<delta>_l<l>_beta<beta>_zeta<zeta>_mu<mu>"
      JOB_NAME_REGEX: "(^|_)k[0-9]+_delta"
      JOB_ARGS: ${PRINK_JOB_ARGS:-}
      # Salt for profile fields with role mask (saltEnv: PRINK_MASK_SALT), taken
      # from the host environment / .env; unset = hash without salt (warning).
      PRINK_MASK_SALT:
    volumes:
      - ./scripts/flink-submit.sh:/opt/scripts/flink-submit.sh:ro
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    networks:
      - kafka-network
    logging: *default-logging

volumes:
  prometheus-data:
  grafana-data:

networks:
  kafka-network:
    driver: bridge
